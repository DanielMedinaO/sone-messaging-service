spring:
  application:
    name: sone-messaging-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sone_messaging}
    username: ${DB_USERNAME:sone_messaging}
    password: ${DB_PASSWORD:sone_messaging}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: main
  flyway:
    enabled: true
    default-schema: public
sone:
  security:
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./keys/public.pem}
  marketplace:
    base-url: ${MARKETPLACE_BASE_URL:http://localhost:3000}
    connect-timeout: 2s
    read-timeout: 3s
