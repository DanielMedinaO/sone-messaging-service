spring:
  application:
    name: sone-messaging-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sone_messaging}
    username: ${DB_USERNAME:sone_messaging}
    password: ${DB_PASSWORD:sone_messaging}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: main
  flyway:
    enabled: true
    default-schema: public
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 16MB
sone:
  security:
    jwt:
      public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:./keys/public.pem}
  websocket:
    # Development default only: production MUST restrict this to the real client origins.
    allowed-origin-patterns: ${WEBSOCKET_ALLOWED_ORIGIN_PATTERNS:*}
  storage:
    # Only 'mock' is available for now; a future S3 adapter will be selected here.
    provider: ${STORAGE_PROVIDER:mock}
  marketplace:
    base-url: ${MARKETPLACE_BASE_URL:http://localhost:3001}
    connect-timeout: 2s
    read-timeout: 3s
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api/docs
  paths-to-match: /api/**
  show-actuator: false
